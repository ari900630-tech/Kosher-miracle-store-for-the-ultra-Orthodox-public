<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פלאי אפליקציות</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">פלאי<span>+</span></div><div><button id="settingsBtn">⚙</button><button id="theme">☾</button></div></header><main><section class="hero"><p>חנות האפליקציות שלך</p><h1>כל האפליקציות<br>במקום אחד</h1><div class="search"><input id="search" placeholder="חפש אפליקציה..."><span>🔎</span></div><div id="status">טוען אפליקציות...</div></section><section><div class="section-title"><h2>קטגוריות</h2></div><div class="cats"><button>🎓 לימודים</button><button>🧰 כלים</button><button>🎮 משחקים</button><button>💼 עבודה</button><button>💬 תקשורת</button><button>📖 תוכן</button></div></section><section><div class="section-title"><h2>אפליקציות</h2></div><div id="apps" class="apps"></div></section></main><button id="centerMore" class="center-more" aria-label="אפשרויות">⋮</button><div id="passwordModal" class="password-modal"><div class="password-card" dir="rtl"><h2>יצירת סיסמה</h2><p>הגדר סיסמה להגנה על הגדרות האפליקציה.</p><input id="newPassword" type="password" inputmode="numeric" autocomplete="new-password" placeholder="סיסמה"><input id="confirmPassword" type="password" inputmode="numeric" autocomplete="new-password" placeholder="אימות סיסמה"><div id="passwordError" class="password-error"></div><button id="savePassword">שמירת סיסמה</button></div></div><div id="settings" class="settings"><div class="settingsCard"><div class="settingsTop"><h2>הגדרות</h2><button id="closeSettings">✕</button></div><button id="createPassword">🔑 יצירת סיסמה</button><button id="deviceAdmin">🔐 אישור שליטה על הטלפון</button><button id="phoneSettings">⚙ פתיחת הגדרות הטלפון</button><button id="appSettings">📱 הגדרות האפליקציה</button><p class="hint">הפעלת ניהול המכשיר חוסמת הסרה רגילה כל עוד הניהול פעיל.</p></div></div><nav><a class="active">⌂<small>בית</small></a><a>⌕<small>חיפוש</small></a><a>▦<small>קטגוריות</small></a><a>↓<small>שלי</small></a><a>◉<small>פרופיל</small></a></nav><script src="app.js"></script></body></html>
